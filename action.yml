name: "OrderStream Commercial License & Telemetry Gate"
description: "Verify OrderStream enterprise license keys, enforce repo quotas, and stream CI security metrics"
branding:
  icon: "shield"
  color: "blue"
inputs:
  license_key:
    description: "OrderStream Enterprise/Team license key"
    required: true
  min_tier:
    description: "Minimum required tier (STARTER, TEAM, ENTERPRISE)"
    required: false
    default: "STARTER"
  telemetry_hub_url:
    description: "OrderStream telemetry ingest endpoint URL"
    required: false
    default: "https://hub.orderstream.dev"
outputs:
  valid:
    description: "Whether the license is valid"
    value: ${{ steps.gate.outputs.valid }}
  tier:
    description: "Licensed tier"
    value: ${{ steps.gate.outputs.tier }}
  client:
    description: "Licensed client organization"
    value: ${{ steps.gate.outputs.client }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install orderstream-commercial-hub
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}
    - name: Verify License Gate
      id: gate
      shell: bash
      run: |
        python -c "
import sys
from orderstream_commercial_hub.license_gate import LicenseManager

key = '${{ inputs.license_key }}'
res = LicenseManager().verify_license(key)
if not res.get('valid'):
    print(f'::error::Invalid OrderStream License: {res.get(\"reason\")}')
    sys.exit(1)
print(f'::notice::Valid OrderStream License: Client={res.get(\"client\")}, Tier={res.get(\"tier\")}')
with open('${GITHUB_OUTPUT:-/dev/null}', 'a') as f:
    f.write(f'valid=true\ntier={res.get(\"tier\")}\nclient={res.get(\"client\")}\n')
"
